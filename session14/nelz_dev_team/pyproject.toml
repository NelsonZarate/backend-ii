[project]
name = "nelz_dev_team"
version = "0.1.0"
description = "Nelz_Dev_Team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.4",
    "google-generativeai>=0.8.6",
    "langchain-ollama>=1.1.0",
]

[project.scripts]
nelz_dev_team = "nelz_dev_team.main:run"
run_crew = "nelz_dev_team.main:run"
train = "nelz_dev_team.main:train"
replay = "nelz_dev_team.main:replay"
test = "nelz_dev_team.main:test"
run_with_trigger = "nelz_dev_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
